<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좀비 생존게임</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151b;color:#eef4fa;font-family:Arial,sans-serif;text-align:center}
main{max-width:960px;margin:25px auto;padding:16px}
h1{margin:8px}
p{color:#b9c5d1}
.bar{display:flex;justify-content:space-between;gap:12px;margin:20px 0;font-size:20px}
canvas{display:block;width:100%;background:#19232d;border:2px solid #405266;border-radius:10px}
button{margin-top:16px;padding:12px 28px;border:0;border-radius:8px;background:#69e5a1;color:#10151b;font-size:18px;font-weight:bold;cursor:pointer}
small{color:#95a5b5}
</style>
</head>
<body>
<main>
<h1>좀비 생존게임</h1>
<p>방향키 또는 WASD로 이동하며 좀비를 피해 살아남으세요.</p>
<div class="bar">
<span id="health">체력: 100</span>
<span id="time">생존: 0.0초</span>
<span id="count">좀비: 0</span>
</div>
<canvas id="game" width="900" height="500"></canvas>
<button id="start">게임 시작</button>
<p><small>파란색: 플레이어 / 초록색: 좀비 · Version 1.1</small></p>
</main>
<script type="module" src="./game.js"></script>
</body>
</html>
