apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zombie-game
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alems0518-creator/zombie-game.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: zombie-game
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
