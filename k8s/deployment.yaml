apiVersion: apps/v1
kind: Deployment
metadata:
  name: zombie-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zombie-game
  template:
    metadata:
      labels:
        app: zombie-game
    spec:
      containers:
        - name: zombie-game
          image: tlsalstjq/zombie-game:bootstrap
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zombie-game
spec:
  type: NodePort
  selector:
    app: zombie-game
  ports:
    - port: 80
      targetPort: 80
